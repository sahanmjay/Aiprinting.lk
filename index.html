    <meta property="og:description" content="High quality commercial printing with instant online pricing matrix and fast island-wide delivery." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- First-load splash: plain CSS so it shows before the JS bundle arrives (same look as
         src/components/ui/loading-lines.tsx). src/main.tsx fades it out once the app renders. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #FAF8F5; transition: opacity 0.4s ease; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      #splash .word { position: relative; padding: 24px 16px; font: 700 30px/1 'Space Grotesk', system-ui, sans-serif; letter-spacing: 0.08em; color: #0F1B2D; user-select: none; }
      #splash .word span { position: relative; z-index: 2; display: inline-block; opacity: 0; animation: splashLetter 4s linear infinite; }
      #splash .lines { position: absolute; inset: 0; z-index: 1; overflow: hidden;
        -webkit-mask: repeating-linear-gradient(90deg, transparent 0, transparent 6px, #000 7px, #000 8px);
                mask: repeating-linear-gradient(90deg, transparent 0, transparent 6px, #000 7px, #000 8px); }
      #splash .glow { position: absolute; inset: 0;
        background-image: radial-gradient(circle at 50% 50%, #FFD100 0%, transparent 50%), radial-gradient(circle at 45% 45%, #EC008C 0%, transparent 45%),
                          radial-gradient(circle at 55% 55%, #00A3E0 0%, transparent 45%), radial-gradient(circle at 45% 55%, #D6342C 0%, transparent 40%);
        -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0%, transparent 10%, #000 25%);
                mask: radial-gradient(circle at 50% 50%, transparent 0%, transparent 10%, #000 25%);
        animation: splashSweep 2s infinite alternate cubic-bezier(0.6, 0.8, 0.5, 1), splashFade 4s infinite; }
      @media (min-width: 640px) { #splash .word { font-size: 48px; } }
      @keyframes splashLetter { 0% { opacity: 0; } 5% { opacity: 1; transform: scale(1.1) translateY(-2px); } 20% { opacity: 0.2; } 100% { opacity: 0; } }
      @keyframes splashSweep { 0% { transform: translateX(-55%); } 100% { transform: translateX(55%); } }
      @keyframes splashFade { 0%, 100% { opacity: 0; } 15% { opacity: 1; } 65% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash .word span { opacity: 1; animation: none; } #splash .glow { animation: none; opacity: 0; } }
    </style>
  </head>
  <body class="bg-[#FAF8F5] text-[#2B2B2B] antialiased selection:bg-[#D6342C] selection:text-white">
    <div id="splash" role="status" aria-label="Loading">
      <div class="word"><span style="animation-delay:0.100s">A</span><span style="animation-delay:0.205s">I</span><span style="animation-delay:0.310s">&nbsp;</span><span style="animation-delay:0.415s">P</span><span style="animation-delay:0.520s">R</span><span style="animation-delay:0.625s">I</span><span style="animation-delay:0.730s">N</span><span style="animation-delay:0.835s">T</span><span style="animation-delay:0.940s">I</span><span style="animation-delay:1.045s">N</span><span style="animation-delay:1.150s">G</span><div class="lines" aria-hidden="true"><div class="glow"></div></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
